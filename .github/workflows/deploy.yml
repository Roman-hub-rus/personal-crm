# Builds the app image on every push to main and rolls it out to both environments on the server:
# the test stand (https://test-app.myfirstcrm.site) and production (https://app.myfirstcrm.site).
# For now production does not wait for the test stand: a red test stand does not stop it.
# All server-side logic lives in deploy/: this workflow only calls deploy/crm-deploy.sh over SSH
# (the forced command of the deploy key), which first receives the whole deploy/ folder.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy run at a time; a newer push waits for the running one instead of cancelling it.
# On the server each environment also has its own lock, so two deploys never change one stand at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: personal-crm:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} --tag "$IMAGE" .

      - uses: ./.github/actions/server-ssh
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ vars.DEPLOY_HOST }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}

      - name: Upload deploy scripts
        run: tar -C deploy -czf - . | ssh server sync

      - name: Upload image
        run: docker save "$IMAGE" | gzip | ssh server load

  staging:
    name: Test stand
    needs: upload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/server-ssh
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ vars.DEPLOY_HOST }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}

      - name: Migrate, switch to the new version, check /health
        run: ssh server release staging ${{ github.sha }}

  prod:
    name: Production
    needs: upload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/server-ssh
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ vars.DEPLOY_HOST }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}

      - name: Back up database, migrate, switch to the new version, check /health
        run: ssh server release prod ${{ github.sha }}
