# Runs on every pull request to main: lint, format, types, Vitest, Playwright and the image build.
# Branch protection on main requires all three jobs to pass before a PR can be merged.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the run that is still going for the previous push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tests create their own databases next to this one ("crm_test", "crm_e2e").
  DATABASE_URL: postgres://crm:crm@localhost:5432/crm

jobs:
  checks:
    name: Lint, format, types, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Unit tests (Vitest)
        run: pnpm run --if-present test

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Playwright uses the Google Chrome that comes preinstalled on the runner.
      - name: E2E tests
        run: pnpm test:e2e

      - name: Keep traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  image:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} --tag personal-crm:ci .
