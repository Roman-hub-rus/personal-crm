# Production stack on the server: the app and its own Postgres, compose project "prod".
# Comes to the server with every deploy (crm-deploy.sh sync puts this folder in /opt/personal-crm/deploy).
# The scripts here run it as `docker compose -p prod -f deploy/compose.yml --env-file /opt/personal-crm/.env`
# (see lib.sh); .env holds the database password, its template is .env.example.
name: prod

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

# Container logs are capped so they cannot fill the server disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    # No published ports: only containers of this stack can reach the database.
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent dir.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off jobs with the app image: `compose run --rm migrate` applies migrations,
  # `compose run --rm migrate node db/seed.mjs` fills an empty database with test contacts.
  migrate:
    image: personal-crm:${APP_TAG:-current}
    profiles: [jobs]
    command: ["node", "db/migrate.mjs"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  app:
    # crm-deploy.sh and rollback.sh point the `current` tag at the version that should run.
    image: personal-crm:${APP_TAG:-current}
    restart: unless-stopped
    environment: *app-env
    ports:
      # Reachable only from the server itself (nginx proxies to it).
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

volumes:
  db-data:
    # The database files. The stack was first started as project "personal-crm" and this volume got its name then.
    # External: compose only attaches it and never creates, recreates or removes it, so the data survives
    # any change to this file. A new server needs it once: `docker volume create personal-crm_db-data`.
    name: personal-crm_db-data
    external: true
